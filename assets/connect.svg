<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img"><style>.spark { animation: tw 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .s2 { animation-delay: -.8s; } .s3 { animation-delay: -1.6s; }
    @keyframes tw { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }</style><defs>
  <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#f97316"/>
  </linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#faf5ff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4c1d95" flood-opacity=".12"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<rect x="14" y="10" width="1172" height="162" rx="26" fill="#fffaf7" stroke="#f3e8ff" filter="url(#shadow)"/>
<clipPath id="cc"><rect x="14" y="10" width="1172" height="162" rx="26"/></clipPath>
<g clip-path="url(#cc)" filter="url(#blur)" opacity=".6">
  <circle cx="120" cy="40" r="120" fill="#e9d5ff"/>
  <circle cx="1100" cy="170" r="130" fill="#fed7aa"/>
  <circle cx="650" cy="190" r="110" fill="#fbcfe8"/>
</g>
