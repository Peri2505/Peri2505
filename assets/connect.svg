<text x="600" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-.8" fill="url(#rainbow)">Let's build something together</text>
<text x="600" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#4b5563">Hiring for security or software? Want to swap ideas on AI, design, or a hackathon?</text>
<text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#4b5563">My inbox is always open — I'd love to hear from you.</text>
</svg>