<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img"><style>
    .f1 { animation: float 6s ease-in-out infinite; }
    .f2 { animation: float 6s ease-in-out -2s infinite; }
    .f3 { animation: float 6s ease-in-out -4s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .b1 { animation: drift 14s ease-in-out infinite; }
    .b2 { animation: drift 14s ease-in-out -7s infinite; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-20px); } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .wave { animation: wave 2.6s ease-in-out infinite; transform-origin: 300px 128px; }
    @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(14deg); } 20%,40% { transform: rotate(-8deg); } }
    </style><defs>
  <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#f97316"/>
  </linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#faf5ff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4c1d95" flood-opacity=".12"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<rect x="0" y="0" width="1200" height="470" rx="28" fill="#fffaf7"/>
<g filter="url(#blur)" opacity=".55">
  <circle class="b1" cx="140" cy="60" r="170" fill="#e9d5ff"/>
  <circle class="b2" cx="1080" cy="80" r="180" fill="#fbcfe8"/>
  <circle class="b1" cx="980" cy="440" r="170" fill="#fed7aa"/>
  <circle class="b2" cx="420" cy="470" r="150" fill="#bae6fd"/>
</g>
<rect x="0" y="0" width="1200" height="470" rx="28" fill="none" stroke="#f3e8ff" stroke-width="2"/>

<rect x="64" y="62" width="356" height="34" rx="17" fill="#ffffff" stroke="#bbf7d0"/>
