<text x="62" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#1e1b4b">Aiperi Moldobaeva</text>
<text x="64" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="url(#rainbow)">Software engineer, growing into security</text>
<text x="64" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19.5" fill="#4b5563">I love building things people actually enjoy using — and making</text>
<text x="64" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19.5" fill="#4b5563">sure they're safe. My sweet spot is where AI, security and design meet.</text>
