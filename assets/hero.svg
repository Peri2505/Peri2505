<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img">
<style>
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 81px 69px; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    .ring { animation: ring 2s ease-out infinite; transform-origin: 81px 69px; }
    @keyframes ring { 0% { transform: scale(1); opacity:.6; } 100% { transform: scale(2.6); opacity:0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .l1 { opacity:0; animation: in .5s ease-out .3s forwards; }
    .l2 { opacity:0; animation: in .5s ease-out 1.1s forwards; }
    .l3 { opacity:0; animation: in .5s ease-out 1.9s forwards; }
    .l4 { opacity:0; animation: in .5s ease-out 2.7s forwards; }
    @keyframes in { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateX(-400px); } to { transform: translateX(1600px); } }
    </style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#070b12"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#1c2636"/>
    <stop offset="1" stop-color="#818cf8" stop-opacity=".45"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  <radialGradient id="glowT" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowI" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#818cf8" stop-opacity=".2"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
  </radialGradient>
  
</defs>
<rect x="1" y="1" width="1198" height="438" rx="18" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="1" y="1" width="1198" height="438" rx="18" fill="url(#grid)"/>

<circle cx="250" cy="120" r="320" fill="url(#glowT)"/>
<circle cx="1000" cy="380" r="300" fill="url(#glowI)"/>
<rect class="scan" x="0" y="1" width="220" height="438" fill="url(#accent)" opacity=".035"/>

